name: studyshorts-pipeline

on:
  schedule:
    - cron: "7 6 * * *"      # research (daily)
    - cron: "37 7 * * *"     # create (daily, after research)
    - cron: "12 * * * *"     # publish (hourly; only posts inside POST_SLOTS_UTC)
    - cron: "47 */6 * * *"   # analytics (every 6h)
    - cron: "22 * * * *"     # supervisor (hourly)
    - cron: "52 */6 * * *"   # tokens (every 6h: TikTok tokens last 24h, refresh when <12h left)
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to run"
        required: true
        type: choice
        options: [research, create, publish, analytics, tokens, supervisor]

concurrency:
  group: studyshorts-${{ github.event.inputs.stage || github.event.schedule }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Only these three are required. Every other key/setting is entered in the dashboard
      # (Settings page), stored encrypted in Supabase, and loaded by each stage at start-up.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SETTINGS_ENCRYPTION_KEY: ${{ secrets.SETTINGS_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Pick stage
        id: stage
        run: |
          case "${{ github.event.schedule }}" in
            "7 6 * * *") s=research;;
            "37 7 * * *") s=create;;
            "12 * * * *") s=publish;;
            "47 */6 * * *") s=analytics;;
            "22 * * * *") s=supervisor;;
            "52 */6 * * *") s=tokens;;
            *) s="${{ github.event.inputs.stage }}";;
          esac
          echo "name=$s" >> "$GITHUB_OUTPUT"
      - name: Install Chrome for rendering
        if: steps.stage.outputs.name == 'create' || steps.stage.outputs.name == 'supervisor'
        run: cd renderer && npx remotion browser ensure
      - run: pnpm --filter worker stage ${{ steps.stage.outputs.name }}
